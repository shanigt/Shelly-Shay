<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EE">
<title>מאזן הוצאות ולוח ימים</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EE;
    --paper-raised:#F8FAF8;
    --ink:#1C2321;
    --ink-soft:#5B6B66;
    --line:#D6DED9;
    --a-color:#2A6F6F;
    --a-tint:#DCEBEA;
    --b-color:#B8703A;
    --b-tint:#F3E4D6;
    --shared-color:#8A7CA8;
    --shared-tint:#E8E3F0;
    --neutral:#6B6F76;
    --danger:#A8433A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Assistant',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  h1{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:900;
    font-size:clamp(26px,6vw,36px);
    margin:0 0 4px;
    letter-spacing:-0.5px;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--paper-raised);border:1px solid var(--line);border-radius:999px;padding:4px;}

  button, .kid-check, .wbtn, .cal-day{ -webkit-tap-highlight-color: transparent; }
  .tab-btn, .payer-toggle button, .add-btn, .settle-btn, .dup-btn, .receipt-link,
  .del, .cal-nav button, .kid-check, .wbtn, .role-btn, .google-btn, .rb-dismiss,
  .pb-approve, .pb-reject, .kid-add-row button, .child-tag, .recur-tag{
    transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease;
  }
  .tab-btn:active, .payer-toggle button:active, .add-btn:active, .settle-btn:active,
  .dup-btn:active, .del:active, .cal-nav button:active, .kid-check:active,
  .wbtn:active, .role-btn:active, .google-btn:active, .pb-approve:active,
  .pb-reject:active, .kid-add-row button:active{
    transform: scale(0.94);
  }

  .expense, .sched-list-item, .pending-banner .pb-item, .recur-banner .rb-item{
    animation: fadeInUp .28s ease;
  }
  .cal-day{ animation: fadeInUp .2s ease; }
  .kid-chip{ animation: fadeInUp .2s ease; }
  .tab-btn{
    flex:1;border:none;background:none;padding:9px 10px;border-radius:999px;
    font-family:'Assistant';font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;
  }
  .tab-btn.active{background:var(--ink);color:#fff;}
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadeInUp .25s ease;}

  .names-row{display:flex;gap:10px;margin-bottom:14px;}
  .name-pill{
    flex:1;
    display:flex;align-items:center;gap:8px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
  }
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .name-pill input{
    border:none;background:transparent;font-family:'Assistant';font-weight:600;
    font-size:15px;color:var(--ink);width:100%;outline:none;
  }

  .kids-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:20px;
  }
  .kids-card label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .kids-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
  .kid-chip{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;font-size:13px;font-weight:600;
  }
  .kid-chip button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0;}
  .kid-chip button:hover{color:var(--danger);}
  .kid-add-row{display:flex;gap:6px;}
  .kid-add-row input{flex:1;}
  .kid-add-row button{
    background:var(--ink);color:#fff;border:none;border-radius:9px;
    padding:0 14px;font-weight:700;cursor:pointer;
  }

  .scale-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 20px 20px;
    margin-bottom:24px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  svg#beam{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;}
  .beam-line{stroke:var(--ink);stroke-width:3;transition:transform .6s cubic-bezier(.34,1.56,.64,1);}
  .pan{transition:transform .6s cubic-bezier(.34,1.56,.64,1);}
  .verdict{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:20px;margin-top:6px;}
  .verdict .amt{font-weight:900;}
  .settle-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .settle-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    font-family:'Assistant';font-weight:600;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer;
  }
  .settle-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .settle-btn.primary-share{background:var(--ink);color:#fff;border-color:var(--ink);}
  .settle-btn.primary-share:hover{opacity:.9;color:#fff;}

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:22px;
  }
  .card h2{font-family:'Frank Ruhl Libre',serif;font-size:17px;margin:0 0 14px;font-weight:700;}
  .card h3{font-family:'Frank Ruhl Libre',serif;font-size:15px;margin:0 0 10px;font-weight:700;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    font-family:'Assistant';font-size:14px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:52px;font-family:'Assistant';}
  .payer-toggle{display:flex;gap:8px;}
  .payer-toggle button{
    flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;
    padding:9px 6px;font-family:'Assistant';font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .payer-toggle button.active-a{border-color:var(--a-color);background:var(--a-tint);color:var(--a-color);}
  .payer-toggle button.active-b{border-color:var(--b-color);background:var(--b-tint);color:var(--b-color);}
  .payer-toggle button.active-shared{border-color:var(--shared-color);background:var(--shared-tint);color:var(--shared-color);}
  .ratio-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .ratio-row input[type=range]{flex:1;}
  .ratio-toggle-btn{
    background:none;border:none;color:var(--ink-soft);font-size:12px;font-family:'Assistant';
    text-decoration:underline;cursor:pointer;padding:0;margin-bottom:8px;
  }
  .fix-ratio-btn{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:#B8860B;
    border:1px solid #D9A441;border-radius:999px;padding:3px 9px;cursor:pointer;background:#FBF3E3;
  }
  .month-row{
    display:flex;align-items:center;gap:10px;background:var(--paper-raised);border:1px solid var(--line);
    border-radius:11px;padding:11px 14px;margin-bottom:8px;cursor:pointer;
  }
  .month-row:hover{border-color:var(--ink-soft);}
  .month-row.active{border-color:var(--ink);background:#fff;}
  .month-row .m-name{font-weight:700;font-size:14px;flex:1;}
  .month-row .m-total{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;}
  .month-row .m-split{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .month-row .m-balance{font-size:12px;color:var(--shared-color);font-weight:600;margin-top:4px;}
  .month-filter-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--shared-tint);color:var(--shared-color);
    border:1px solid var(--shared-color);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;
    margin-bottom:10px;
  }
  .month-filter-chip button{background:none;border:none;color:inherit;cursor:pointer;font-size:13px;padding:0;}
  .split-preview{margin-top:8px;font-size:12.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  .file-row{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:9px;padding:8px 10px;background:#fff;}
  .file-row label.filelbl{margin:0;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;flex:1;}
  .file-row input[type=file]{display:none;}
  .file-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);}
  .file-row .clearfile{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:13px;}
  .ocr-btn{
    margin-top:8px;width:100%;background:#fff;border:1.5px dashed var(--shared-color);color:var(--shared-color);
    border-radius:9px;padding:9px;font-family:'Assistant';font-weight:700;font-size:13px;cursor:pointer;
  }
  .ocr-btn:disabled{opacity:.5;cursor:default;}
  .ocr-status{font-size:11.5px;color:var(--ink-soft);margin-top:6px;min-height:14px;}
  .ocr-suggest{
    display:inline-block;margin:3px 4px 0 0;background:var(--shared-tint);border:1px solid var(--shared-color);
    color:var(--shared-color);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;
    font-family:'Assistant';cursor:pointer;
  }
  .ocr-suggest.applied{background:var(--a-tint);border-color:var(--a-color);color:var(--a-color);opacity:.7;}
  .receipt-source-row{display:flex;gap:8px;margin-bottom:8px;}
  .filelbl-btn{
    flex:1;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:9px;
    padding:10px 6px;font-family:'Assistant';font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;
  }
  #receiptCamera{display:none;}
  .add-btn{
    margin-top:14px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:9px;
    padding:11px;font-family:'Assistant';font-weight:700;font-size:15px;cursor:pointer;
  }
  .add-btn:hover{opacity:.9;}

  .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .list-head h2{font-family:'Frank Ruhl Libre',serif;font-size:17px;font-weight:700;margin:0;}
  .filters{display:flex;gap:6px;}
  select.small{width:auto;padding:6px 8px;font-size:12px;}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 10px;border:1px dashed var(--line);border-radius:var(--radius);}
  .expense{background:var(--paper-raised);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;}
  .expense-top{display:flex;align-items:center;gap:10px;}
  .expense .who-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .expense .info{flex:1;min-width:0;}
  .expense .desc{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .expense .meta{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .cat-edit-select{
    border:none;background:transparent;color:inherit;font:inherit;font-size:12px;
    text-decoration:underline dotted;cursor:pointer;padding:0;appearance:auto;
  }
  .payer-edit-select{
    border:none;background:transparent;color:inherit;font:inherit;font-size:12px;font-weight:600;
    text-decoration:underline dotted;cursor:pointer;padding:0;appearance:auto;
  }
  .edit-toggle-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1;
  }
  .edit-toggle-btn:hover{color:var(--ink);}
  .edit-row{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;
  }
  .edit-row input{flex:1;min-width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Assistant';font-size:13px;background:#fff;}
  .edit-actions{display:flex;gap:6px;width:100%;}
  .edit-save-btn, .edit-cancel-btn{
    flex:1;border:none;border-radius:8px;padding:7px;font-family:'Assistant';font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .edit-save-btn{background:var(--ink);color:#fff;}
  .edit-cancel-btn{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
  .show-more-btn{
    display:block;width:100%;background:var(--paper-raised);border:1px dashed var(--line);border-radius:10px;
    padding:10px;font-family:'Assistant';font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-top:4px;
  }
  .show-more-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .expense .amt{font-weight:700;font-size:15px;font-family:'Frank Ruhl Libre',serif;white-space:nowrap;}
  .expense .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 6px;line-height:1;}
  .expense .del:hover{color:var(--danger);}
  .expense .owe-line{
    font-size:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);
  }
  .expense .owe-line b{color:var(--ink);font-weight:700;}
  .expense .notes{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-style:italic;}
  .dup-month-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .dup-month-row input[type=month]{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:'Assistant';font-size:12px;background:#fff;
  }
  .dup-month-btn{
    background:var(--shared-tint);color:var(--shared-color);border:1px solid var(--shared-color);
    border-radius:8px;padding:6px 10px;font-family:'Assistant';font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .receipt-link{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;background:#fff;
  }
  .receipt-link:hover{border-color:var(--ink-soft);color:var(--ink);}
  .child-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--neutral);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;}
  .child-tag + .child-tag{margin-inline-start:4px;}

  .recur-toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    font-size:13px;font-weight:600;color:var(--ink-soft);margin:0;
  }
  .recur-toggle input{margin:0;accent-color:var(--ink);width:16px;height:16px;flex-shrink:0;}
  .recur-tag{
    display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--shared-color);
    background:var(--shared-tint);border:1px solid var(--shared-color);border-radius:999px;padding:2px 8px;
  }
  .dup-btn{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;background:#fff;
  }
  .dup-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .recur-banner{
    background:var(--shared-tint);border:1px solid var(--shared-color);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--ink);
  }
  .recur-banner .rb-title{font-weight:700;margin-bottom:8px;}
  .recur-banner .rb-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fff;border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;
  }
  .recur-banner .rb-item button{
    background:var(--ink);color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .recur-banner .rb-dismiss{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}

  .pending-banner{
    background:#FBF3E3;border:1px solid #D9A441;border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--ink);
  }
  .pending-banner .pb-title{font-weight:700;margin-bottom:8px;}
  .pending-banner .pb-item{
    background:#fff;border-radius:9px;padding:9px 11px;margin-bottom:7px;
  }
  .pending-banner .pb-item .pb-desc{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .pending-banner .pb-item .pb-meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .pending-banner .pb-actions{display:flex;gap:8px;}
  .pending-banner .pb-actions button{
    flex:1;border:none;border-radius:7px;padding:7px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .pending-banner .pb-approve{background:var(--a-color);color:#fff;}
  .pending-banner .pb-reject{background:none;border:1px solid var(--line) !important;color:var(--ink-soft);}
  .pending-tag{
    display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#B8860B;
    background:#FBF3E3;border:1px solid #D9A441;border-radius:999px;padding:2px 8px;
  }

  .kid-checks{display:flex;flex-wrap:wrap;gap:7px;}
  .kid-check{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .kid-check input{margin:0;accent-color:var(--ink);}
  .kid-check.checked{border-color:var(--shared-color);background:var(--shared-tint);color:var(--shared-color);}

  .totals{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .totals .t{flex:1;min-width:100px;border-radius:11px;padding:10px 12px;text-align:center;font-size:12px;color:var(--ink-soft);}
  .totals .t b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:16px;color:var(--ink);margin-top:2px;}
  .share-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;}
  .export-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .backup-row{display:flex;gap:8px;}
  .export-btn{
    flex:1;min-width:110px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px;
    font-family:'Assistant';font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;
  }
  .export-btn:hover{border-color:var(--ink-soft);}
  #printArea{display:none;}
  @media print{
    .no-print, .tabs, .kids-card, .scale-card, .card, .share-note, .names-row, h1, .sub, #pendingApproval, #recurBanner{display:none !important;}
    #printArea{display:block !important;}
    body{padding:0;background:#fff;}
    #printArea h1{font-family:'Frank Ruhl Libre',serif;font-size:22px;margin-bottom:4px;}
    #printArea .meta-line{font-size:12px;color:#555;margin-bottom:16px;}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px;}
    #printArea th, #printArea td{border:1px solid #ccc;padding:5px 7px;text-align:right;}
    #printArea th{background:#f0f0f0;}
    #printArea .totals-line{margin-top:14px;font-size:13px;font-weight:700;}
  }

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(28,35,33,.75);align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal-bg img{max-width:100%;max-height:85vh;border-radius:8px;}
  .modal-close{position:absolute;top:18px;left:18px;background:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-bottom:12px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .weekday-setter{display:flex;gap:5px;}
  .weekday-setter .wbtn{
    flex:1;aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;

<div class="wrap">
  <h1>מאזן משותף</h1>

  <div class="tabs">

    <button class="tab-btn" data-tab="schedule">לוח ימים</button>
  </div>

  <div class="names-row">
    <div class="name-pill"><span class="dot" style="background:var(--a-color)"></span><input id="nameA" type="text" value="שלי"></div>
    <div class="name-pill"><span class="dot" style="background:var(--b-color)"></span><input id="nameB" type="text" value="שי"></div>
  </div>

        <input type="text" id="kidInput" placeholder="שם">
        <button id="kidAddBtn" type="button">הוספה</button>
      </div>
    </div>

    <div class="kids-card">
      <label>קטגוריות</label>
      <div class="kids-chips" id="catChips"></div>

        <input type="text" id="catInput" placeholder="קטגוריה חדשה">

      </div>
    </div>

    <div class="kids-card">
      <label>גיבוי ושחזור</label>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;">

      </div>
      <div class="backup-row">
        <button type="button" class="export-btn" id="backupBtn">💾 הורדת גיבוי</button>

        <input type="file" id="restoreInput" accept="application/json" style="display:none;">
      </div>
      <div class="ocr-status" id="backupStatus"></div>
      <textarea id="backupTextFallback" readonly style="display:none;width:100%;height:120px;margin-top:8px;font-size:10px;font-family:monospace;direction:ltr;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px;"></textarea>
    </div>

      <label>סף לאישור הוצאה גדולה (₪) — 0 = בלי אישור</label>

        <input type="number" id="approvalThreshold" min="0" step="10" placeholder="לדוגמה: 300">
      </div>
    </div>

        <circle cx="200" cy="18" r="5" fill="var(--ink)"/>
        <g id="beamGroup" class="beam-line">

        </g>

          <ellipse cx="60" cy="112" rx="34" ry="9" fill="var(--a-tint)" stroke="var(--a-color)" stroke-width="2"/>
        </g>
        <g id="panB" class="pan">
          <line x1="340" y1="70" x2="340" y2="105" stroke="var(--b-color)" stroke-width="2"/>
          <ellipse cx="340" cy="112" rx="34" ry="9" fill="var(--b-tint)" stroke="var(--b-color)" stroke-width="2"/>
        </g>

            <input type="date" id="recurUntil">

        </div>
        <div class="full">
          <label>הערות</label>
          <textarea id="notes" placeholder="פרטים נוספים..."></textarea>
        </div>
      </div>
      <button class="add-btn" id="addBtn">הוספת הוצאה</button>

  </div>

  }

    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(cache)); }catch(e){}
  }

  let cache = localLoad();

  return {
    async get(key){ return (key in cache) ? { key, value: cache[key] } : null; },
    async set(key, value){ cache[key] = value; localSave(cache); return { key, value }; },
    async delete(key){ delete cache[key]; localSave(cache); return { key }; },
    async list(prefix){ return { keys: Object.keys(cache).filter(k=>!prefix||k.startsWith(prefix)) }; },
    async exportAll(){ return JSON.parse(JSON.stringify(cache)); },
    async importAll(obj){ cache = { ...obj }; localSave(cache); }
  };
})();

let expenses = [];
let names = { a: 'שלי', b: 'שי' };
let kids = ['רוני', 'מאיה', 'עמרי', "צ'רלי (כלב)"];
let categories = ['בריאות','חינוך','חוגים','ביגוד','פנאי','מזון','אחר'];
let selectedPayer = 'a';
let approvalThreshold = 0;
let payments = []; 
let payFrom = 'a';
let editingPaymentId = null;
let filterMonth = null; 
let expenseListLimit = 20; 

let weeklyPattern = ['a','b','a','b','a','shared','shared']; 
let overrides = [], vacations = [], holidays = [], events = []; 
let calView = new Date(); calView.setDate(1);

const $ = id => document.getElementById(id);
const WD_NAMES = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

function fmt(n){ return '₪' + Number(n).toLocaleString('he-IL', {maximumFractionDigits:2}); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function activateTab(tabName){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
  $('tab'+tabName.charAt(0).toUpperCase()+tabName.slice(1)).classList.add('active');
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> activateTab(btn.dataset.tab));
});

async function loadAll(){
  try{ const r = await window.storage.get('expenses'); expenses = r ? JSON.parse(r.value) : []; }catch(e){ expenses = []; }
  try{ const r = await window.storage.get('names'); if(r) names = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('kids'); if(r) kids = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('categories'); if(r) categories = JSON.parse(r.value); }catch(e){}
  try{ const r = await window.storage.get('payments'); payments = r ? JSON.parse(r.value) : []; }catch(e){ payments = []; }
  try{ const r = await window.storage.get('approvalThreshold'); approvalThreshold = r ? (parseFloat(r.value)||0) : 0; }catch(e){ approvalThreshold = 0; }

  $('nameA').value = names.a; $('nameB').value = names.b;
  $('approvalThreshold').value = approvalThreshold || '';
  updatePayerButtons();
  renderKidsChips(); renderKidSelects();
  renderCatChips(); renderCatSelects();
  renderWhoSelects();
  renderWeekdaySetter();
  renderCalendar();
  render();
}
async function saveExpenses(){ await window.storage.set('expenses', JSON.stringify(expenses)); }
async function saveNames(){ await window.storage.set('names', JSON.stringify(names)); }
async function saveKids(){ await window.storage.set('kids', JSON.stringify(kids)); }
async function saveCategories(){ await window.storage.set('categories', JSON.stringify(categories)); }

$('backupBtn').addEventListener('click', async ()=>{
  const data = await window.storage.exportAll();
  const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), data}, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `גיבוי-מאזן-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
$('restoreInput').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const data = parsed && parsed.data ? parsed.data : parsed; 
    await window.storage.importAll(data);
    await loadAll();
    alert('✓ השחזור הושלם בהצלחה!');
  }catch(err){ alert('השחזור נכשל'); }
  finally{ e.target.value = ''; }
});

function whoLabel(who){ return who==='a' ? names.a : who==='b' ? names.b : 'משותף'; }
function renderWhoSelects(){
  const opts = `<option value="a">${escapeHtml(names.a)}</option><option value="b">${escapeHtml(names.b)}</option><option value="shared">משותף</option>`;
  $('ovWho').innerHTML = opts; $('vacWho').innerHTML = opts; $('holWho').innerHTML = opts;
  $('legA').textContent = names.a; $('legB').textContent = names.b;
}

$('nameA').addEventListener('change', e=>{ names.a = e.target.value || 'שלי'; saveNames(); updatePayerButtons(); renderWhoSelects(); render(); });
$('nameB').addEventListener('change', e=>{ names.b = e.target.value || 'שי'; saveNames(); updatePayerButtons(); renderWhoSelects(); render(); });

function updatePayerButtons(){
  $('btnA').textContent = 'שילם/ה ' + names.a;
  $('btnB').textContent = 'שילם/ה ' + names.b;
  $('btnA').className = selectedPayer === 'a' ? 'active-a' : '';$('btnB').className = selectedPayer === 'b' ? 'active-b' : '';
}

function renderKidsChips(){
  $('kidsChips').innerHTML = kids.map((k,i)=>`<span class="kid-chip">${escapeHtml(k)}<button onclick="removeKid(${i})">✕</button></span>`).join('');
}
function renderKidSelects(){
  const opts = kids.map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
  $('filterKid').innerHTML = '<option value="all">כולם</option>' + opts;
  $('evtKid').innerHTML = '<option value="">משותף / כללי</option>' + opts;
  renderKidChecks();
}
function renderKidChecks(){
  $('kidChecks').innerHTML = kids.map((k,i)=>`
    <label class="kid-check" data-i="${i}">
      <input type="checkbox" value="${escapeHtml(k)}">
      <span>${escapeHtml(k)}</span>
    </label>`).join('');
  document.querySelectorAll('.kid-check').forEach(lbl=>{
    const cb = lbl.querySelector('input');
    cb.addEventListener('change', ()=> lbl.classList.toggle('checked', cb.checked));
  });
}
function getCheckedKids(){
  return Array.from(document.querySelectorAll('#kidChecks input:checked')).map(cb=>cb.value);
}
async function removeKid(i){ kids.splice(i,1); await saveKids(); renderKidsChips(); renderKidSelects(); render(); }
$('kidAddBtn').addEventListener('click', async ()=>{
  const v = $('kidInput').value.trim();
  if(!v || kids.includes(v)){ $('kidInput').value=''; return; }
  kids.push(v); await saveKids(); $('kidInput'].value='';
  renderKidsChips(); renderKidSelects();
});

function renderCatChips(){
  $('catChips').innerHTML = categories.map((c,i)=>`<span class="kid-chip">${escapeHtml(c)}${c==='אחר'?'':`<button onclick="removeCategory(${i})">✕</button>`}</span>`).join('');
}
function renderCatSelects(){
  const opts = categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  $('category').innerHTML = opts; $('filterCat').innerHTML = '<option value="all">כל הקטגוריות</option>' + opts;
}
async function removeCategory(i){ categories.splice(i,1); await saveCategories(); renderCatChips(); renderCatSelects(); }
$('catAddBtn').addEventListener('click', async ()=>{
  const v = $('catInput').value.trim();
  if(!v || categories.includes(v)){ $('catInput'].value=''; return; }
  categories.splice(categories.length-1, 0, v);
  await saveCategories(); $('catInput'].value='';
  renderCatChips(); renderCatSelects();
});

$('btnA').addEventListener('click', ()=>{ selectedPayer='a'; updatePayerButtons(); updateSplitPreview(); });$('btnB').addEventListener('click', ()=>{ selectedPayer='b'; updatePayerButtons(); updateSplitPreview(); });
$('ratio').addEventListener('input', e=>{$('ratioLabel').textContent = e.target.value+'% / '+(100-e.target.value)+'%'; updateSplitPreview(); });
$('amount').addEventListener('input', updateSplitPreview);$('ratioToggleBtn').addEventListener('click', ()=>{
  const sec = $('ratioSection');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  updateSplitPreview();
});

function effectiveRatioA(){ return $('ratioSection').style.display === 'none' ? 50 : parseInt($('ratio').value); }
function updateSplitPreview(){
  const amount = parseFloat($('amount').value) || 0;
  const ratioA = effectiveRatioA();
  const shareA = amount * ratioA/100, shareB = amount - shareA;
  const payerName = selectedPayer==='a' ? names.a : names.b;
  const ower = selectedPayer==='a' ? names.b : names.a;
  const owed = selectedPayer==='a' ? shareB : shareA;
  $('splitPreview').textContent = amount<=0 ? '' : `${payerName} שילם/ה ${fmt(amount)} · ${ower} מחזיר/ה ${fmt(owed)}`;
}
$('date').valueAsDate = new Date();

$('addBtn').addEventListener('click', async ()=>{
  const desc = $('desc').value.trim();
  const amount = parseFloat($('amount').value);
  const date = $('date').value;
  const category = $('category').value;
  const children = getCheckedKids();
  const notes = $('notes').value.trim();
  const ratioA = effectiveRatioA();
  if(!desc || !amount || amount<=0 || !date){ alert('נא למלא תיאור, סכום ותאריך'); return; }
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  expenses.push({ id, desc, amount, date, category, children, notes, paidBy: selectedPayer, ratioA, status: 'approved' });
  await saveExpenses();
  $('desc').value=''; $('amount').value='';$('notes').value='';
  render();
});

$('filterCat').addEventListener('change', render);
$('filterKid').addEventListener('change', render);$('searchText').addEventListener('input', render);

function computeBalance(){
  let net = 0;
  expenses.forEach(e=>{
    const shareA = e.amount * (e.ratioA/100), shareB = e.amount - shareA;
    if(e.paidBy==='a') net += shareB; else net -= shareA;
  });
  payments.forEach(p=>{ net += (p.from==='b' ? -p.amount : p.amount); });
  return net;
}

function updateScale(){
  const net = computeBalance();
  let tilt = net>0 ? -10 : net<0 ? 10 : 0;
  ['beamGroup','panA','panB'].forEach(id=>{
    document.getElementById(id).style.transform = `rotate(${tilt}deg)`;
    document.getElementById(id).style.transformOrigin = '200px 70px';
  });
  $('labelA').textContent = names.a; $('labelB').textContent = names.b;
  const verdict = $('verdict');
  if(Math.abs(net) < 0.01){
    verdict.innerHTML = 'המאזן מאוזן ✓';
    $('shareBtn').style.display = 'none';
  } else if(net > 0){
    verdict.innerHTML = `<span style="color:var(--b-color)">${escapeHtml(names.b)}</span> חייב/ת ל<span style="color:var(--a-color)">${escapeHtml(names.a)}</span> <span class="amt">${fmt(net)}</span>`;
    $('shareBtn').style.display = 'inline-block';
  } else {
    verdict.innerHTML = `<span style="color:var(--a-color)">${escapeHtml(names.a)}</span> חייב/ת ל<span style="color:var(--b-color)">${escapeHtml(names.b)}</span> <span class="amt">${fmt(-net)}</span>`;
    $('shareBtn').style.display = 'inline-block';
  }
}

async function deleteExpense(id){
  expenses = expenses.filter(e=>e.id!==id);
  await saveExpenses(); render();
}

function expenseKids(e){ return Array.isArray(e.children) ? e.children : (e.child ? [e.child] : []); }

function render(){
  updateScale();
  const filterCat = $('filterCat').value, filterKid =$('filterKid').value;
  const searchQ = $('searchText').value.trim().toLowerCase();
  let filtered = [...expenses].sort((a,b)=> b.date.localeCompare(a.date));
  if(filterCat!=='all') filtered = filtered.filter(e=>e.category===filterCat);
  if(filterKid!=='all') filtered = filtered.filter(e=>expenseKids(e).includes(filterKid));
  if(filterMonth) filtered = filtered.filter(e=> e.date.slice(0,7)===filterMonth);
  if(searchQ) filtered = filtered.filter(e=> e.desc.toLowerCase().includes(searchQ) || (e.notes||'').toLowerCase().includes(searchQ));

  $('list').innerHTML = filtered.length===0 ? '<div class="empty">אין הוצאות להצגה.</div>' : filtered.slice(0, expenseListLimit).map(e=>{
    const payerName = e.paidBy==='a' ? names.a : names.b;
    const color = e.paidBy==='a' ? 'var(--a-color)' : 'var(--b-color)';
    const shareA = e.amount*(e.ratioA/100);
    const owed = e.paidBy==='a' ? (e.amount-shareA) : shareA;
    const childTag = expenseKids(e).map(k=>`<span class="child-tag">${escapeHtml(k)}</span>`).join('');
    return `<div class="expense">
      <div class="expense-top">
        <span class="who-dot" style="background:${color}"></span>
        <div class="info"><div class="desc">${escapeHtml(e.desc)}</div><div class="meta">${e.date} · ${escapeHtml(e.category)} ${childTag}</div></div>
        <div class="amt">${fmt(e.amount)}</div>
        <button class="del" onclick="deleteExpense('${e.id}')">✕</button>
      </div>
      <div class="owe-line"><span>שולם ע"י ${escapeHtml(payerName)} · מחזיר/ה <b>${fmt(owed)}</b></span></div>
    </div>`;
  }).join('');

  let totalA=0, totalB=0;
  expenses.forEach(e=>{ if(e.paidBy==='a') totalA+=e.amount; else totalB+=e.amount; });
  $('totals').innerHTML = `
    <div class="t" style="background:var(--a-tint);color:var(--a-color)">שילם/ה ${escapeHtml(names.a)}<b>${fmt(totalA)}</b></div>
    <div class="t" style="background:var(--b-tint);color:var(--b-color)">שילם/ה ${escapeHtml(names.b)}<b>${fmt(totalB)}</b></div>
    <div class="t" style="background:var(--shared-tint);color:var(--shared-color)">סה"כ<b>${fmt(totalA+totalB)}</b></div>`;
}

function renderWeekdaySetter(){
  $('weekdaySetter').innerHTML = weeklyPattern.map((w,i)=>`
    <div class="wbtn owner-${w}">
      <span class="wname">${WD_NAMES[i]}</span>
      <span>${w==='a'?names.a.slice(0,4):w==='b'?names.b.slice(0,4):'משותף'}</span>
    </div>`).join('');
}
function renderCalendar(){
  const y = calView.getFullYear(), m = calView.getMonth();
  $('calTitle').textContent = calView.toLocaleDateString('he-IL', {month:'long', year:'numeric'});
  const firstDay = new Date(y,m,1).getDay(), daysInMonth = new Date(y,m+1,0).getDate();
  let html = WD_NAMES.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  for(let i=0;i<firstDay;i++) html += '<div class="cal-day empty-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wIdx = new Date(dateStr+'T00:00:00').getDay();
    const who = weeklyPattern[wIdx];
    html += `<div class="cal-day owner-${who}">${d}</div>`;
  }
  $('calGrid').innerHTML = html;
}

loadAll();
</script>
